name: Deploy to Oracle Ubuntu

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-production-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: slack-afk-automation-bot
  TRIVY_VERSION: v0.72.0
  TRIVY_CACHE_DIR: .trivy-cache
  SECURITY_REPORT_DIR: security-reports
  TRIVY_SKIP_DIRS: .git,node_modules,logs,coverage,.trivy-cache,zap-reports,security-reports

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  trivy-security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image: ${{ steps.push-scanned-image.outputs.image }}
      digest: ${{ steps.push-scanned-image.outputs.digest }}
      tag: ${{ steps.push-scanned-image.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Cache Trivy vulnerability database
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-db-${{ runner.os }}-${{ env.TRIVY_VERSION }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-${{ env.TRIVY_VERSION }}-
            trivy-db-${{ runner.os }}-

      - name: Prepare report directory
        run: mkdir -p "$SECURITY_REPORT_DIR"

      - name: Build Docker image for scanning
        run: |
          docker buildx build \
            --load \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "$IMAGE_NAME:${GITHUB_SHA}" \
            .

      - name: Locate Trivy HTML template
        id: trivy-template
        run: |
          template_path="$(find "$HOME/.local/bin/trivy-bin" -path '*/contrib/html.tpl' -print -quit)"
          test -n "$template_path"
          echo "html_template=$template_path" >> "$GITHUB_OUTPUT"

      - name: Generate Trivy filesystem reports
        run: |
          trivy fs . \
            --scanners vuln,misconfig,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --skip-dirs "$TRIVY_SKIP_DIRS" \
            --format sarif \
            --output "$SECURITY_REPORT_DIR/trivy-filesystem.sarif"
          trivy fs . \
            --scanners vuln,misconfig,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --skip-dirs "$TRIVY_SKIP_DIRS" \
            --format template \
            --template "@${{ steps.trivy-template.outputs.html_template }}" \
            --output "$SECURITY_REPORT_DIR/trivy-filesystem.html"
          trivy fs . \
            --scanners vuln,misconfig,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --skip-dirs "$TRIVY_SKIP_DIRS" \
            --format json \
            --output "$SECURITY_REPORT_DIR/trivy-filesystem.json"

      - name: Generate Trivy dependency reports
        run: |
          trivy fs . \
            --scanners vuln \
            --pkg-types library \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --skip-dirs "$TRIVY_SKIP_DIRS" \
            --format sarif \
            --output "$SECURITY_REPORT_DIR/trivy-dependencies.sarif"
          trivy fs . \
            --scanners vuln \
            --pkg-types library \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --skip-dirs "$TRIVY_SKIP_DIRS" \
            --format template \
            --template "@${{ steps.trivy-template.outputs.html_template }}" \
            --output "$SECURITY_REPORT_DIR/trivy-dependencies.html"
          trivy fs . \
            --scanners vuln \
            --pkg-types library \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --skip-dirs "$TRIVY_SKIP_DIRS" \
            --format json \
            --output "$SECURITY_REPORT_DIR/trivy-dependencies.json"

      - name: Generate Trivy Docker image reports
        run: |
          trivy image "$IMAGE_NAME:${GITHUB_SHA}" \
            --scanners vuln,misconfig,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format sarif \
            --output "$SECURITY_REPORT_DIR/trivy-image.sarif"
          trivy image "$IMAGE_NAME:${GITHUB_SHA}" \
            --scanners vuln,misconfig,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format template \
            --template "@${{ steps.trivy-template.outputs.html_template }}" \
            --output "$SECURITY_REPORT_DIR/trivy-image.html"
          trivy image "$IMAGE_NAME:${GITHUB_SHA}" \
            --scanners vuln,misconfig,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output "$SECURITY_REPORT_DIR/trivy-image.json"

      - name: Generate SBOM artifacts
        run: |
          trivy fs . \
            --skip-dirs "$TRIVY_SKIP_DIRS" \
            --format cyclonedx \
            --output "$SECURITY_REPORT_DIR/trivy-filesystem-sbom.cdx.json"
          trivy image "$IMAGE_NAME:${GITHUB_SHA}" \
            --format cyclonedx \
            --output "$SECURITY_REPORT_DIR/trivy-image-sbom.cdx.json"

      - name: Publish filesystem SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: ${{ env.SECURITY_REPORT_DIR }}/trivy-filesystem.sarif
          category: trivy-filesystem

      - name: Publish dependency SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: ${{ env.SECURITY_REPORT_DIR }}/trivy-dependencies.sarif
          category: trivy-dependencies

      - name: Publish Docker image SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: ${{ env.SECURITY_REPORT_DIR }}/trivy-image.sarif
          category: trivy-image

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-security-reports
          path: ${{ env.SECURITY_REPORT_DIR }}/trivy-*
          if-no-files-found: error
          retention-days: 30

      - name: Add Trivy workflow summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const reportDir = process.env.SECURITY_REPORT_DIR;
          const files = [
            ['Filesystem', 'trivy-filesystem.json'],
            ['Dependencies', 'trivy-dependencies.json'],
            ['Docker image', 'trivy-image.json'],
          ];
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const directDeps = new Set(Object.keys({
            ...(pkg.dependencies || {}),
            ...(pkg.optionalDependencies || {}),
            ...(pkg.peerDependencies || {}),
          }));

          const packageGraph = new Map();
          for (const [, file] of files) {
            const fullPath = path.join(reportDir, file);
            if (!fs.existsSync(fullPath)) continue;
            const report = JSON.parse(fs.readFileSync(fullPath, 'utf8'));
            for (const result of report.Results || []) {
              for (const item of result.Packages || []) {
                packageGraph.set(item.ID || `${item.Name}@${item.Version}`, item);
              }
            }
          }

          function parentsOf(pkgId) {
            const parents = [];
            for (const item of packageGraph.values()) {
              if ((item.DependsOn || []).includes(pkgId)) {
                parents.push(item);
              }
            }
            return parents;
          }

          function directParentChain(vulnerability) {
            const pkgId = `${vulnerability.PkgName}@${vulnerability.InstalledVersion}`;
            const queue = parentsOf(pkgId).map((item) => ({ item, via: [item.Name] }));
            const seen = new Set();
            while (queue.length) {
              const current = queue.shift();
              const key = current.item.ID || `${current.item.Name}@${current.item.Version}`;
              if (seen.has(key)) continue;
              seen.add(key);
              if (directDeps.has(current.item.Name) || current.item.Relationship === 'direct') {
                return current.via.join(' -> ');
              }
              for (const parent of parentsOf(key)) {
                queue.push({ item: parent, via: [parent.Name, ...current.via] });
              }
            }
            return directDeps.has(vulnerability.PkgName) ? vulnerability.PkgName : 'Review dependency tree';
          }

          function guidance(vulnerability) {
            const fixed = vulnerability.FixedVersion || 'No fixed version published';
            if (directDeps.has(vulnerability.PkgName)) {
              return fixed === 'No fixed version published'
                ? `Monitor ${vulnerability.PkgName} advisory and apply compensating controls.`
                : `Upgrade direct dependency ${vulnerability.PkgName} to ${fixed} or later.`;
            }
            const parent = directParentChain(vulnerability);
            return fixed === 'No fixed version published'
              ? `Review parent dependency ${parent}; no fixed transitive version is currently listed.`
              : `Upgrade parent dependency ${parent} so ${vulnerability.PkgName} resolves to ${fixed} or later.`;
          }

          const criticals = [];
          for (const [scan, file] of files) {
            const fullPath = path.join(reportDir, file);
            if (!fs.existsSync(fullPath)) continue;
            const report = JSON.parse(fs.readFileSync(fullPath, 'utf8'));
            for (const result of report.Results || []) {
              for (const vulnerability of result.Vulnerabilities || []) {
                if (String(vulnerability.Severity).toUpperCase() === 'CRITICAL') {
                  criticals.push({ scan, target: result.Target || '', vulnerability });
                }
              }
            }
          }

          const lines = [];
          lines.push('## Trivy security scan', '');
          lines.push('| Scan | SARIF | HTML | JSON | SBOM |');
          lines.push('| --- | --- | --- | --- | --- |');
          lines.push('| Filesystem | trivy-filesystem.sarif | trivy-filesystem.html | trivy-filesystem.json | trivy-filesystem-sbom.cdx.json |');
          lines.push('| Dependencies | trivy-dependencies.sarif | trivy-dependencies.html | trivy-dependencies.json | Included in filesystem SBOM |');
          lines.push('| Docker image | trivy-image.sarif | trivy-image.html | trivy-image.json | trivy-image-sbom.cdx.json |');
          lines.push('', `Skipped filesystem noise directories: \`${process.env.TRIVY_SKIP_DIRS}\`.`, '');
          lines.push('Quality gate: CRITICAL vulnerabilities, any secrets, and HIGH/CRITICAL misconfigurations fail Trivy and block deployment. Other findings are reported for triage.', '');
          lines.push('### CRITICAL vulnerability remediation');
          if (criticals.length === 0) {
            lines.push('', 'No CRITICAL vulnerabilities found in the generated Trivy JSON reports.');
          } else {
            lines.push('', '| Scan | Target | Package | CVE | Installed | Fixed | Remediation |');
            lines.push('| --- | --- | --- | --- | --- | --- | --- |');
            for (const finding of criticals) {
              const v = finding.vulnerability;
              const cve = v.VulnerabilityID || 'Unknown';
              const fixed = v.FixedVersion || 'Not listed';
              lines.push(`| ${finding.scan} | ${finding.target || 'N/A'} | ${v.PkgName || 'Unknown'} | ${cve} | ${v.InstalledVersion || 'Unknown'} | ${fixed} | ${guidance(v)} |`);
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Trivy security gate (CRITICAL vulns, secrets, misconfigs)
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const reportDir = process.env.SECURITY_REPORT_DIR;
          const files = [
            ['Filesystem', 'trivy-filesystem.json'],
            ['Dependencies', 'trivy-dependencies.json'],
            ['Docker image', 'trivy-image.json'],
          ];
          const criticals = [];
          const secrets = [];
          const misconfigs = [];
          const blockingMisconfig = new Set(['HIGH', 'CRITICAL']);

          for (const [scan, file] of files) {
            const fullPath = path.join(reportDir, file);
            if (!fs.existsSync(fullPath)) {
              console.error(`::error::Missing Trivy JSON report: ${fullPath}`);
              process.exit(1);
            }
            const report = JSON.parse(fs.readFileSync(fullPath, 'utf8'));
            for (const result of report.Results || []) {
              const target = result.Target || 'N/A';
              for (const vulnerability of result.Vulnerabilities || []) {
                if (String(vulnerability.Severity).toUpperCase() === 'CRITICAL') {
                  criticals.push({
                    scan,
                    target,
                    packageName: vulnerability.PkgName || 'Unknown',
                    cve: vulnerability.VulnerabilityID || 'Unknown',
                    installed: vulnerability.InstalledVersion || 'Unknown',
                    fixed: vulnerability.FixedVersion || 'Not listed',
                  });
                }
              }
              for (const secret of result.Secrets || []) {
                secrets.push({
                  scan,
                  target,
                  rule: secret.RuleID || secret.Title || 'Unknown secret',
                  severity: secret.Severity || 'UNKNOWN',
                });
              }
              for (const misconfig of result.Misconfigurations || []) {
                const severity = String(misconfig.Severity || '').toUpperCase();
                if (blockingMisconfig.has(severity)) {
                  misconfigs.push({
                    scan,
                    target,
                    id: misconfig.ID || misconfig.AVDID || 'Unknown',
                    title: misconfig.Title || misconfig.Type || 'Misconfiguration',
                    severity,
                  });
                }
              }
            }
          }

          let failed = false;
          if (criticals.length > 0) {
            failed = true;
            for (const finding of criticals) {
              console.error(`::error title=Trivy CRITICAL vulnerability::${finding.scan} ${finding.target}: ${finding.packageName} ${finding.cve}, installed ${finding.installed}, fixed ${finding.fixed}`);
            }
          }
          if (secrets.length > 0) {
            failed = true;
            for (const finding of secrets) {
              console.error(`::error title=Trivy secret finding::${finding.scan} ${finding.target}: ${finding.rule} (${finding.severity})`);
            }
          }
          if (misconfigs.length > 0) {
            failed = true;
            for (const finding of misconfigs) {
              console.error(`::error title=Trivy misconfiguration::${finding.scan} ${finding.target}: ${finding.id} ${finding.title} (${finding.severity})`);
            }
          }
          if (failed) {
            process.exit(1);
          }
          console.log('Trivy found no CRITICAL vulnerabilities, secrets, or HIGH/CRITICAL misconfigurations.');
          NODE

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image
        id: push-scanned-image
        run: |
          registry_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          tag="${GITHUB_SHA}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${registry_image}:${tag}"
          docker push "${registry_image}:${tag}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${registry_image}:${tag}" | awk -F@ '{print $2}')"
          test -n "$digest"
          echo "image=${registry_image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed scanned image ${registry_image}:${tag}@${digest}"

  zap-baseline:
    name: OWASP ZAP Baseline (Staging)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ZAP_TARGET_URL: ${{ secrets.ZAP_STAGING_TARGET_URL }}
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ZAP_REPORT_DIR: zap-reports
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate non-production ZAP target
        run: |
          test -n "$ZAP_TARGET_URL"
          echo "::add-mask::$ZAP_TARGET_URL"
          if [ -n "$PRODUCTION_URL" ]; then
            echo "::add-mask::$PRODUCTION_URL"
          fi
          if [ -n "$ORACLE_HOST" ]; then
            echo "::add-mask::$ORACLE_HOST"
          fi
          node <<'NODE'
          const target = process.env.ZAP_TARGET_URL;
          const prod = process.env.PRODUCTION_URL || '';
          const oracleHost = process.env.ORACLE_HOST || '';
          const fail = (message) => {
            console.error(`::error::${message}`);
            process.exit(1);
          };
          let targetUrl;
          try {
            targetUrl = new URL(target);
          } catch {
            fail('ZAP_STAGING_TARGET_URL must be a valid absolute URL.');
          }
          if (!['http:', 'https:'].includes(targetUrl.protocol)) {
            fail('ZAP_STAGING_TARGET_URL must use http or https.');
          }
          if (prod && target.replace(/\/+$/, '') === prod.replace(/\/+$/, '')) {
            fail('ZAP target matches PRODUCTION_URL. Refusing to scan production.');
          }
          if (oracleHost && targetUrl.hostname === oracleHost) {
            fail('ZAP target hostname matches ORACLE_HOST. Refusing to scan production.');
          }
          NODE

      - name: Prepare ZAP report directory
        run: |
          rm -rf "$ZAP_REPORT_DIR"
          mkdir -p "$ZAP_REPORT_DIR"
          chmod 777 "$ZAP_REPORT_DIR"

      - name: Resolve ZAP scan URL
        run: |
          node <<'NODE'
          const fs = require('fs');
          const target = new URL(process.env.ZAP_TARGET_URL);
          const health = new URL(target.toString());
          if (health.pathname === '/' || health.pathname === '') {
            health.pathname = '/health';
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `ZAP_SCAN_URL=${target.toString()}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `ZAP_HEALTH_URL=${health.toString()}\n`);
          console.log(`::add-mask::${target.toString()}`);
          console.log(`::add-mask::${health.toString()}`);
          console.log('Prepared ZAP target URL from ZAP_STAGING_TARGET_URL.');
          NODE

      - name: Run OWASP ZAP Baseline Scan
        run: |
          if ! curl --fail --silent --show-error --max-time 15 "$ZAP_SCAN_URL" >/dev/null; then
            echo "Primary ZAP target was not reachable with a successful HTTP response; trying /health on the same origin."
            if curl --fail --silent --show-error --max-time 15 "$ZAP_HEALTH_URL" >/dev/null; then
              echo "ZAP_SCAN_URL=$ZAP_HEALTH_URL" >> "$GITHUB_ENV"
              ZAP_SCAN_URL="$ZAP_HEALTH_URL"
            else
              echo "::warning::Neither the primary target nor /health returned a successful HTTP response. ZAP will still run against the configured target so reports are produced."
            fi
          fi
          set +e
          docker run --rm \
            --volume "$PWD/$ZAP_REPORT_DIR:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "$ZAP_SCAN_URL" \
              -a \
              -I \
              -m 1 \
              -r zap-report.html \
              -J zap-report.json \
              -z "-config api.disablekey=true"
          zap_exit=$?
          set -e
          sudo chown -R "$(id -u):$(id -g)" "$ZAP_REPORT_DIR" || true
          echo "OWASP ZAP baseline exited with code $zap_exit; the JSON quality gate will evaluate HIGH-risk findings."

      - name: Debug ZAP report locations
        if: always()
        run: |
          echo "Expected ZAP report directory: $PWD/$ZAP_REPORT_DIR"
          echo "Workspace ZAP report search:"
          find "$PWD" -maxdepth 4 \( -name 'zap-report.html' -o -name 'zap-report.json' \) -type f -print -exec ls -lh {} \; || true
          for report in zap-report.html zap-report.json; do
            found="$(find "$PWD" -maxdepth 4 -name "$report" -type f -print -quit)"
            if [ -n "$found" ] && [ "$found" != "$PWD/$ZAP_REPORT_DIR/$report" ]; then
              cp "$found" "$ZAP_REPORT_DIR/$report"
            fi
          done
          echo "Files prepared for artifact upload:"
          find "$ZAP_REPORT_DIR" -maxdepth 2 -type f -print -exec ls -lh {} \; || true
          missing=0
          for report in zap-report.html zap-report.json; do
            if [ ! -s "$ZAP_REPORT_DIR/$report" ]; then
              echo "::error::Missing expected OWASP ZAP report: $ZAP_REPORT_DIR/$report"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            {
              echo "OWASP ZAP report generation failed."
              echo "Expected files:"
              echo "- $ZAP_REPORT_DIR/zap-report.html"
              echo "- $ZAP_REPORT_DIR/zap-report.json"
              echo
              echo "The workflow searched the workspace and could not find one or more expected reports."
            } > "$ZAP_REPORT_DIR/zap-report-debug.txt"
            echo "::error::OWASP ZAP did not write the expected reports into $ZAP_REPORT_DIR. Check the Docker mount and zap-baseline.py output above."
            exit 1
          fi

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-baseline-security-reports
          path: ${{ env.ZAP_REPORT_DIR }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Add ZAP workflow summary
        if: always()
        run: |
          {
            echo "## OWASP ZAP baseline scan"
            echo
            echo "Target: staging/test URL from \`secrets.ZAP_STAGING_TARGET_URL\`."
            echo
            echo "| Report | File |"
            echo "| --- | --- |"
            echo "| HTML | zap-report.html |"
            echo "| JSON | zap-report.json |"
            echo
            echo "Quality gate: only HIGH-risk ZAP findings block deployment. LOW, MEDIUM, and INFO alerts are reported for triage."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ZAP HIGH-risk finding gate
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'zap-reports/zap-report.json';
          if (!fs.existsSync(path)) {
            console.error('::error::Missing ZAP JSON report.');
            process.exit(1);
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const sites = Array.isArray(report.site) ? report.site : [];
          const highAlerts = [];
          for (const site of sites) {
            const alerts = Array.isArray(site.alerts) ? site.alerts : [];
            for (const alert of alerts) {
              const risk = String(alert.riskcode ?? '').trim();
              const riskDescription = String(alert.riskdesc ?? '').toLowerCase();
              if (risk === '3' || riskDescription.startsWith('high')) {
                highAlerts.push({
                  name: alert.alert || alert.name || 'Unknown alert',
                  risk: alert.riskdesc || alert.risk || 'High',
                  url: Array.isArray(alert.instances) && alert.instances[0]?.uri ? alert.instances[0].uri : site['@name'] || 'Unknown URL',
                });
              }
            }
          }
          if (highAlerts.length > 0) {
            console.error(`::error::OWASP ZAP found ${highAlerts.length} HIGH-risk alert(s).`);
            for (const alert of highAlerts) {
              console.error(`::error title=OWASP ZAP HIGH-risk finding::${alert.name} (${alert.risk}) at ${alert.url}`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              '',
              '### OWASP ZAP HIGH-risk findings',
              '',
              '| Alert | Risk | URL |',
              '| --- | --- | --- |',
              ...highAlerts.map((alert) => `| ${alert.name} | ${alert.risk} | ${alert.url} |`),
              '',
            ].join('\n'));
            process.exit(1);
          }
          console.log('OWASP ZAP found no HIGH-risk alerts.');
          NODE

  security-quality-gate:
    name: Security Quality Gate
    runs-on: ubuntu-latest
    needs:
      - trivy-security
      - zap-baseline
    timeout-minutes: 5
    if: always()
    permissions:
      contents: read
    steps:
      - name: Enforce deployment security gate
        run: |
          trivy_result='${{ needs.trivy-security.result }}'
          zap_result='${{ needs.zap-baseline.result }}'

          {
            echo "## Security quality gate"
            echo
            echo "| Gate | Result | Blocks deployment when |"
            echo "| --- | --- | --- |"
            echo "| Trivy | $trivy_result | CRITICAL vulns, any secrets, or HIGH/CRITICAL misconfigs |"
            echo "| OWASP ZAP Baseline | $zap_result | HIGH-risk findings are found |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          if [ "$trivy_result" != "success" ]; then
            echo "::error title=Security gate blocked deployment::Trivy Security Scan result was '$trivy_result'. Production deploy is blocked when Trivy reports CRITICAL vulnerabilities, secrets, HIGH/CRITICAL misconfigurations, or the Trivy job cannot complete."
            failed=1
          fi
          if [ "$zap_result" != "success" ]; then
            echo "::error title=Security gate blocked deployment::OWASP ZAP Baseline result was '$zap_result'. Production deploy is blocked when ZAP reports HIGH-risk findings or the ZAP job cannot produce reports."
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "Security quality gate passed."

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - security-quality-gate
      - trivy-security
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment: production
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_PORT: ${{ secrets.ORACLE_PORT || '22' }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/slack-afk-bot' }}
      APP_IMAGE: ${{ needs.trivy-security.outputs.image }}
      APP_IMAGE_TAG: ${{ needs.trivy-security.outputs.tag }}
      APP_IMAGE_DIGEST: ${{ needs.trivy-security.outputs.digest }}
    steps:
      - name: Validate required secrets and scanned image
        run: |
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_USER"
          test -n "$ORACLE_SSH_KEY"
          test -n "$APP_IMAGE"
          test -n "$APP_IMAGE_TAG"
          test -n "$APP_IMAGE_DIGEST"
          echo "Deploying scanned image ${APP_IMAGE}:${APP_IMAGE_TAG}@${APP_IMAGE_DIGEST}"

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull scanned image
        run: |
          docker pull "${APP_IMAGE}@${APP_IMAGE_DIGEST}"
          docker tag "${APP_IMAGE}@${APP_IMAGE_DIGEST}" "${APP_IMAGE}:${APP_IMAGE_TAG}"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_deploy_key
          chmod 600 ~/.ssh/oracle_deploy_key
          ssh-keyscan -p "$ORACLE_PORT" -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

      - name: Transfer scanned image and deploy over SSH
        run: |
          docker save "${APP_IMAGE}:${APP_IMAGE_TAG}" | gzip | ssh -i ~/.ssh/oracle_deploy_key -p "$ORACLE_PORT" "$ORACLE_USER@$ORACLE_HOST" \
            'set -euo pipefail; if docker ps >/dev/null 2>&1; then gunzip | docker load; else gunzip | sudo docker load; fi'

          ssh -i ~/.ssh/oracle_deploy_key -p "$ORACLE_PORT" "$ORACLE_USER@$ORACLE_HOST" \
            "DEPLOY_ROOT='$DEPLOY_ROOT' REPO='https://github.com/${{ github.repository }}.git' BRANCH='${{ github.ref_name }}' APP_IMAGE='${APP_IMAGE}:${APP_IMAGE_TAG}' bash -s" <<'SCRIPT'
          set -euo pipefail

          APP_DIR="$DEPLOY_ROOT/app"
          ENV_FILE="$DEPLOY_ROOT/.env"

          command -v git >/dev/null || { echo "git is not installed on the server"; exit 1; }
          command -v docker >/dev/null || { echo "docker is not installed on the server"; exit 1; }
          DOCKER="docker"
          if ! docker ps >/dev/null 2>&1; then
            DOCKER="sudo docker"
          fi
          $DOCKER compose version >/dev/null || { echo "docker compose plugin is not installed on the server"; exit 1; }

          sudo mkdir -p "$DEPLOY_ROOT"
          sudo chown "$USER:$USER" "$DEPLOY_ROOT"

          if [ ! -f "$ENV_FILE" ]; then
            echo "Missing $ENV_FILE"
            echo "Create it on the server from .env.example before deploying."
            exit 1
          fi
          chmod 600 "$ENV_FILE"

          if [ ! -d "$APP_DIR/.git" ]; then
            rm -rf "$APP_DIR"
            git clone --branch "$BRANCH" "$REPO" "$APP_DIR"
          fi

          cd "$APP_DIR"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"

          ln -sfn ../.env .env
          mkdir -p logs nginx/certs nginx/certbot-www

          if ! $DOCKER image inspect "$APP_IMAGE" >/dev/null 2>&1; then
            echo "Scanned image not present on server: $APP_IMAGE"
            $DOCKER images
            exit 1
          fi

          export APP_IMAGE
          $DOCKER compose -f docker-compose.yml -f docker-compose.server.yml up -d --no-build --remove-orphans app redis
          $DOCKER compose -f docker-compose.yml -f docker-compose.server.yml ps

          APP_CONTAINER="$($DOCKER compose -f docker-compose.yml -f docker-compose.server.yml ps -q app)"
          for attempt in $(seq 1 30); do
            STATUS="$($DOCKER inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$APP_CONTAINER")"
            if [ "$STATUS" = "healthy" ]; then
              break
            fi
            if [ "$STATUS" = "unhealthy" ]; then
              $DOCKER compose -f docker-compose.yml -f docker-compose.server.yml logs --tail=120 app
              exit 1
            fi
            sleep 2
          done

          STATUS="$($DOCKER inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$APP_CONTAINER")"
          if [ "$STATUS" != "healthy" ]; then
            echo "App did not become healthy. Current status: $STATUS"
            $DOCKER compose -f docker-compose.yml -f docker-compose.server.yml logs --tail=120 app
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3000/health
          SCRIPT
